type EvaluationAvg {
  questionTitle: String!
  value: String!
  percent: Int!
  isExpert: Boolean!
}

type Query {
  getAllEval: [Evaluation!]!
  getSelectEvaluation(id: String!): [Evaluation!]!
  getAvgData(id: String!): Int!
  getEvaluationAvg(round: Int!): [EvaluationAvg]!
}

type Mutation {
  createEvaluation(
    userKey: String
    questionKey: String!
    score: Int!
    description: String!
  ): Boolean!

  deleteEvaluation(id: String!): Boolean!
}
